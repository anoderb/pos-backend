name: Deploy Tokiva Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Tidak checkout via SSH dari runner.
      # VPS sudah memiliki deploy key read-only untuk git pull private repo.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.156.234.176
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/pos-backend
            git pull --ff-only
            export PATH=/home/ubuntu/.hermes/node/bin:$PATH
            npm install --omit=dev
            sudo systemctl restart tokiva-backend
            sleep 5
            curl -s -o /dev/null -w "health:%{http_code}\n" http://localhost:5000/health
