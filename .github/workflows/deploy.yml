name: Deploy Tokiva Backend

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # VPS sudah memiliki deploy key read-only untuk git pull private repo.
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.156.234.176
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            cd /home/ubuntu/pos-backend
            git fetch origin main
            git merge --ff-only origin/main
            export PATH=/home/ubuntu/.hermes/node/bin:$PATH
            npm install --omit=dev
            sudo systemctl restart tokiva-backend
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
              if [ "$code" = "200" ]; then
                echo "health:$code"
                exit 0
              fi
              sleep 2
            done
            sudo systemctl status tokiva-backend --no-pager
            echo "health:$code"
            exit 1
